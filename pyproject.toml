[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttbar-reconstruction-studies"
version = "0.1.0"
description = "Research code for dileptonic top-pair reconstruction: models, losses and physics evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ruijia Liu"}]
dependencies = ["numpy>=1.24,<3", "torch>=2.4.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
